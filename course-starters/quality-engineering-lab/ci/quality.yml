name: quality
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run learner tests and retain exit code
        run: |
          set -o pipefail
          python run_tests.py 2>&1 | tee test-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.txt
