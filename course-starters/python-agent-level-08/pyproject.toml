[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-assistant-level-08"
version = "0.1.0"
description = "Python → Agent 课程的可运行工单查询助手"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
